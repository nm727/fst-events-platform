---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: monitoring
data:
  events-dashboard.json: |-
    {
      "id": null,
      "uid": "fst-events-overview",
      "title": "Events App – Monitoring",
      "tags": [
        "fst",
        "spring-boot",
        "devops"
      ],
      "timezone": "browser",
      "schemaVersion": 41,
      "version": 1,
      "refresh": "15s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Application UP (1 = healthy)",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "fst-prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "up{job=\"events-app\"}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 2,
          "title": "JVM Heap Used",
          "type": "timeseries",
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 16,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "fst-prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(jvm_memory_used_bytes{job=\"events-app\",area=\"heap\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 3,
          "title": "HTTP Requests per Second",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "fst-prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_requests_seconds_count{job=\"events-app\"}[5m]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 4,
          "title": "Application Process CPU",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 7,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "fst-prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "process_cpu_usage{job=\"events-app\"}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        }
      ]
    }
